# This file defines the services for Render.com deployment.

# Define the FastAPI backend service
- name: rag-chatbot-backend
  type: web
  buildCommand: pip install -r backend/requirements.txt
  startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
  envVars:
    - key: COHERE_API_KEY
      sync: false # Set in Render dashboard as a secret
    - key: QDRANT_URL
      sync: false
    - key: QDRANT_API_KEY
      sync: false
    - key: DATABASE_URL
      sync: false
    - key: GEMINI_API_KEY
      sync: false
    - key: INGESTION_API_KEY
      sync: false
    - key: FRONTEND_URL
      sync: false
    - key: DOCS_DIRECTORY
      value: docs
  # Health check for the service (T087)
  healthCheckPath: /health/
  healthCheckInterval: 30s
  healthCheckTimeout: 10s
  healthCheckFailureThreshold: 3
  healthCheckSuccessThreshold: 1
  numInstances: 1 # Free tier limit
  plan: starter # Free tier

# Note: This render.yaml assumes the Docusaurus frontend is deployed separately
# (e.g., via GitHub Pages) and the chat widget is embedded from a static host
# or directly from Docusaurus static assets.
